<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="output-section">
            <div class="password-display">
                <input type="text" id="passwordOutput" readonly placeholder="Your password will appear here">
                <button id="copyBtn" class="copy-btn">Copy</button>
            </div>
        </div>

        <div class="controls-section">
            <div class="control-group">
                <label for="length">Length:</label>
                <input type="number" id="length" min="4" max="50" value="12">
                <span id="lengthValue">12</span>
            </div>

            <div class="options">
                <label class="checkbox">
                    <input type="checkbox" id="lowercase" checked>
                    <span>LowerCase</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="uppercase" checked>
                    <span>UpperCase</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="numbers" checked>
                    <span>Numbers</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" id="symbols" checked>
                    <span>Symbols</span>
                </label>
            </div>

            <button id="generateBtn" class="generate-btn">Generate Password</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
